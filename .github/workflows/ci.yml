name: CI

on:
  push:
    branches: [main, integration/bolt-v0.2-overhaul]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies and refresh lock during integration
        run: npm install
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build portable release
        run: npm run build:single
      - name: Verify portable release
        run: npm run verify:single
      - name: Upload integration outputs
        uses: actions/upload-artifact@v4
        with:
          name: eelforge-v0.2-integration
          path: |
            package-lock.json
            releases/EELForge-v0.2-Handoff.html
      - name: Record verified integration outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/integration/bolt-v0.2-overhaul'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json releases/EELForge-v0.2-Handoff.html
          if git diff --cached --quiet; then
            echo "Verified outputs are already current."
            exit 0
          fi
          git commit -m "Record verified v0.2 integration outputs"
          git push
