EELFORGE v0.2 — AI AGENT HANDOFF

This is a generated, self-contained edition of EELForge.

EELForge is a local-first workbench that converts an audio-DSP brief and
runtime contract into deterministic prompts for AI agents working with EEL2.

JSON, Markdown, and plain-language contracts. No agent needs the Superpowers
skill or any proprietary harness. Qwen, Mistral, Claude, Gemini, ChatGPT,
Codex, Bolt, local coding agents, and human developers can all use it.

IMPLEMENTED MODES
Architect, Build, Repair, Refine, Optimize, and Review.

NON-NEGOTIABLE BEHAVIOR
- Preserve offline and direct file:// operation.

- Treat punctuation-only values as empty and omit empty optional prompt blocks.
- Architect requests design, not final code.
- Review requests findings, not a rewritten script.
- Do not claim EEL2 validation without actual host or compiler evidence.

CANONICAL-SOURCE POLICY
This HTML is a generated handoff artifact. Accepted changes must be backported
