EELForge is a local-first workbench that converts an audio-DSP brief and

JSON, Markdown, and plain-language contracts. No agent needs the Superpowers

Architect, Build, Repair, Refine, Optimize, and Review.

- Architect requests design, not final code.
- Review requests findings, not a rewritten script.
- Do not claim EEL2 validation without actual host or compiler evidence.
